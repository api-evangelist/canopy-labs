name: Canopy Labs
description: >-
  Canopy Labs was a customer analytics and predictive marketing SaaS company
  founded in 2012 in the Toronto, Ontario area (Thornhill) by Wojciech Gryc and
  Jorge Escobedo, with an additional office in San Francisco. A Y Combinator
  alumnus, it built machine-learning software that helped businesses model and
  predict customer behavior, optimize purchase funnels, and personalize
  marketing across the customer journey. The company raised seed funding from
  investors including BDC Venture Capital's IT Fund and Valar Ventures. In 2018
  Canopy Labs was acquired by Drop Technologies (the customer-loyalty app Drop),
  after which the independent product, website (canopylabs.com), and any
  developer/API surface were wound down. This profile is retained as a
  historical company record; the entity no longer operates independently and
  publishes no live API.
